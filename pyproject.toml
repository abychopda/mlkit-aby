[project]
name = "mlkit-aby"
version = "0.3.2"
description = "A reusable machine learning toolkit for reproducible experimentation and weather-derived forecasting."
readme = "README.md"
authors = [
    { name = "Abhishek Chopda", email = "abychopda@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "requests",
    "joblib",
]

[tool.uv.build-backend]
module-name = "mlkit_aby"
module-root = "src"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

# TestPyPI is declared explicitly so that publishing never targets the real
# PyPI index by accident.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.uv.sources]
mlkit-aby = { workspace = true }

[dependency-groups]
dev = [
    "mlkit-aby",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
